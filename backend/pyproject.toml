[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "scan-photos-backend"
version = "0.1.0"
description = "Backend FastAPI para trazabilidad de lotes"
requires-python = ">=3.12"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.104.1"
uvicorn = {version = "^0.24.0", extras = ["standard"]}
sqlmodel = "^0.0.14"
alembic = "^1.12.1"
asyncpg = "^0.29.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
argon2-cffi = "^23.2.0"
itsdangerous = "^2.1.2"
structlog = "^23.2.0"
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
httpx = "^0.25.2"
ruff = "^0.1.8"
mypy = "^1.7.1"

[tool.poetry.group.dev.dependencies]
